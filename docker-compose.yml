# EC2 에서 실행되는 컨테이너 정의.
# GitHub Actions 가 이 파일을 EC2 로 복사하고, APP_IMAGE(GHCR 이미지)를 주입해 실행한다.
#   export APP_IMAGE=ghcr.io/basecampgsm/basecamp_server:<sha>
#   docker compose pull && docker compose up -d
# (교육용 AWS 계정이라 ECR 을 못 만들어 GitHub 자체 저장소 GHCR 을 사용)
#
# DB 는 자체 컨테이너가 아니라 Supabase(관리형 PostgreSQL)를 쓴다.
# 실제 시크릿(Supabase/Google OAuth/Claude 등)은 이 파일과 같은 디렉토리의
# .env 파일(EC2 에 직접 생성, git 에는 없음. .env.example 참고)에서 주입된다.
#
# caddy: HTTPS 리버스 프록시. 도메인으로 들어오는 443/80 을 받아 인증서를 자동 발급하고
#        내부 basecamp-server:8080 으로 전달한다. (Caddyfile 참고)
#        → Google OAuth 는 https 리다이렉트를 요구하므로 이 계층이 반드시 필요하다.

services:
  basecamp-server:
    image: ${APP_IMAGE:-ghcr.io/basecampgsm/basecamp_server:latest}
    container_name: basecamp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 앱 쪽 application.yml 이 server.port 를 임의로 바꿔도(현재 4000 하드코딩)
      # 배포 포트는 항상 8080 으로 고정한다. 환경변수가 yml 값보다 우선순위가 높음.
      - SERVER_PORT=8080

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - basecamp-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서 보관(재배포 시 재발급 방지)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
