server:
  port: 4000
  address: 0.0.0.0
  # Caddy(리버스 프록시) 뒤에서 실행되므로, X-Forwarded-* 헤더를 신뢰해
  # OAuth 리다이렉트 주소({baseUrl})가 http 가 아니라 https 로 생성되도록 한다.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

servlet:
  session:
    timeout: 30m

api:
  anthropic:
    key: ${ANTHROPIC_API_KEY:}
  public-data:
    key: ${PUBLIC_DATA_API_KEY:}
  local-data:
    key: ${LOCAL_DATA_API_KEY:}
  kakao:
    key: ${KAKAO_REST_API_KEY:}