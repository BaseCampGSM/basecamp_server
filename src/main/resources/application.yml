server:
  port: 4000
  address: 0.0.0.0
  forward-headers-strategy: framework

  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: none
        secure: true

spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "https://basecampclient.vercel.app/auth/callback/google"

api:
  anthropic:
    key: ${ANTHROPIC_API_KEY:}
  public-data:
    key: ${PUBLIC_DATA_API_KEY:}
  local-data:
    key: ${LOCAL_DATA_API_KEY:}
  kakao:
    key: ${KAKAO_REST_API_KEY:}