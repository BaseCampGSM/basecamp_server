spring.application.name=BaseCamp_server

# ── 서버 포트 ──────────────────────────────────────────────
# CloudType 배포 스펙(options.ports)과 동일하게 8080 을 사용한다.
# 환경변수 PORT 가 있으면 그 값을, 없으면 8080 을 사용.
server.port=${PORT:8080}

# ── [1단계] DB 없이 부팅 ───────────────────────────────────
# 아직 엔티티/리포지토리가 없어 MySQL 연결이 불필요하므로,
# DataSource/JPA 자동설정을 잠시 제외해 DB 없이도 앱이 뜨게 한다.
# (이게 없으면 JPA + MySQL 드라이버가 classpath 에 있어 부팅 시 DB 연결을 시도하다 실패)
#
# ⚠️ 실제로 DB 를 쓰기 시작하면(엔티티/리포지토리 추가) 아래 한 줄을 삭제하고
#    docs/DEPLOY.md 의 "2단계: MySQL 연결" 을 따라 env 변수를 설정할 것.
# ※ Spring Boot 4 에서 자동설정 패키지가 이동됨(autoconfigure.jdbc → jdbc.autoconfigure).
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# ── [2단계] MySQL 연결 시 사용 (지금은 주석) ───────────────
# 값은 코드가 아니라 CloudType 환경변수로 주입한다(비밀번호 하드코딩 금지).
# spring.datasource.url=${SPRING_DATASOURCE_URL}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.jpa.open-in-view=false

# ── AI 서비스(FastAPI) 연동 ────────────────────────────────
# 백엔드가 호출할 AI 서비스 주소. 통신 규격: POST {ai.service.url}/api/ai/solve-issue
# 로컬 개발은 http://localhost:8000, 배포 환경은 CloudType 의 AI 서비스 주소로
# env(AI_SERVICE_URL)를 주입한다. (호출 클라이언트 코드 추가 시 이 값을 사용)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
